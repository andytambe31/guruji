name: Terraform (infra)

# Keyless AWS auth via GitHub OIDC / WIF — no static credentials in GitHub.
# The role is created by infra/bootstrap; set these repo Variables
# (Settings → Secrets and variables → Actions → Variables):
#   AWS_ROLE_ARN     the CI role ARN from bootstrap output
#   TF_STATE_BUCKET  the state bucket from bootstrap output
#   TF_LOCK_TABLE    the lock table from bootstrap output (default guruji-tf-locks)

on:
  pull_request:
    paths: ["infra/**", "services/api/**", ".github/workflows/deploy-infra.yml"]
  workflow_dispatch:
    inputs:
      env:
        description: Environment to apply
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.8

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Format check (advisory)
        continue-on-error: true
        run: terraform fmt -check -recursive ../../
      - name: Write backend config
        run: |
          cat > backend.hcl <<HCL
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "guruji/${{ matrix.env }}/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          HCL
      - run: terraform init -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform plan -input=false -no-color

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Write backend config
        run: |
          cat > backend.hcl <<HCL
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "guruji/${{ inputs.env }}/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          HCL
      - run: terraform init -backend-config=backend.hcl
      - run: terraform apply -input=false -auto-approve
